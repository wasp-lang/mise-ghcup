on:
  workflow_dispatch:
  push:
    branches:
      - main

name: Continuous Deployment

concurrency:
  group: "release"
  cancel-in-progress: false

jobs:
  ci:
    uses: $/.github/workflows/ci.yaml
    secrets: inherit

  release-please:
    needs: ci

    runs-on: ubuntu-latest

    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - uses: googleapis/release-please-action@v5
