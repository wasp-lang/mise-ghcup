on:
  workflow_dispatch:
  push:
    branches:
      - main

name: Continuous Deployment

concurrency:
  group: "release"
  cancel-in-progress: false

jobs:
  ci:
    uses: $/.github/workflows/ci.yaml
    secrets: inherit

  release-please:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      issues: write
      pull-requests: write

    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}

    steps:
      - uses: googleapis/release-please-action@v5
        id: release

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v6

      - run: |
          mkdir -p dist
          git archive --format=tar HEAD | gzip -n > dist/mise-ghcup.tar.gz

      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG" dist/mise-ghcup.tar.gz --repo "$GITHUB_REPOSITORY"

      - uses: jdx/packslip@v1
        with:
          artifacts: dist/mise-ghcup.tar.gz
          manifest: packslip.toml
          tag: ${{ needs.release-please.outputs.tag_name }}
